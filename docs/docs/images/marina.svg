  </defs>
  <path d="M16 86C32 80 47 51 60 36q4-5 8 0c14 16 24 49 40 44q6-2 9-8" stroke="url(#marina-flow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
