[package]
name = "marina-python"
version = "0.5.2"
edition = "2024"

[lib]
name = "marina"
crate-type = ["cdylib"]

[features]
minot-registry = ["marina/minot-registry"]

[dependencies]
marina = { path = "../.." }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
tokio = { version = "1", features = ["rt"] }
