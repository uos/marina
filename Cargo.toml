[package]
name = "marina"
version = "0.3.1"
edition = "2024"
include = ["**/*.rs", "**/*.md", "**/Cargo.toml", "**/LICENSE*", "default.rl"]
keywords = ["robotics"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/stelzo/marina"
authors = ["Christopher Sieh <stelzo@steado.de>"]
description = "A dataset manager for robotics to organize, share, and discover datasets and metadata across storage backends."
rust-version = "1.85.1"

[lib]
name = "marina"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "marina"
path = "src/main.rs"

[features]
default = ["osnabotics-default-registry", "db3"]
osnabotics-default-registry = ["gdrive"]
db3 = ["dep:rusqlite"]
gdrive = ["dep:base64", "dep:ring", "dep:regex"]
# Serve and consume registries over a Minot network. Off by default: it pulls in
# Zenoh, which roughly doubles marina's build time and binary size.
minot-registry = ["dep:mt_flow", "dep:mt_pubsub", "dep:mt_sea", "dep:mt_service", "dep:rkyv"]
cloudini-cpp = ["cloudini/use_cpp"]

[dependencies]
anyhow = "1.0"
ctrlc = "3.5"
futures = "0.3"
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
cloudini = { version = "0.3", default-features = false, features = ["ros"] }
cdr = "0.2"
dirs = "6.0"
flate2 = "1.1"
glob = "0.3"
humantime = "2.3"
indicatif = "0.18"
base64 = { version = "0.23", optional = true }
ring = { version = "0.17", optional = true }
mcap = { version = "0.25", features = ["zstd", "lz4"] }
# Path dependencies while the streaming work is in flight; these versions are
# not published yet. Revisit before releasing with `minot-registry` enabled.
mt_flow = { path = "../minot/mt_flow", optional = true }
mt_pubsub = { path = "../minot/mt_pubsub", optional = true }
mt_sea = { path = "../minot/mt_sea", optional = true }
mt_service = { path = "../minot/mt_service", optional = true }
rkyv = { version = "0.8.18", optional = true }
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "multipart",
  "query",
  "rustls",
  "stream",
] }
regex = { version = "1.13", optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
ros2-interfaces-jazzy-serde = { version = "0.0.5", features = [
  "sensor_msgs",
  "std_msgs",
  "builtin_interfaces",
] }
ros_pointcloud2 = { version = "1.0.0-rc.4", features = [
  "ros2_interfaces_jazzy_serde",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "2.4"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "net",
  "io-util",
  "macros",
  "fs",
  "process",
  "sync",
  "time",
] }
async-trait = "0.1"
rpassword = "7"
tar = "0.4"
ratslang = "0.4.3"
walkdir = "2.5"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
tempfile = "3.27"

[dev-dependencies]
flate2 = "1.1"
tar = "0.4"
env_logger = "0.11"
tempfile = "3.27"

[lints.clippy]
manual_is_multiple_of = "allow" # rust 1.85 compatible

[profile.release]
strip = "symbols" # Significantly reduce binary size
opt-level = "s"   # Optimize for size but keep some performance
debug = 0
panic = "abort"

[profile.full-release]
inherits = "release"
lto = "fat"          # Link Time Optimization
codegen-units = 1    # Slower compile times but compiler sees all generated code and can optimize over everything across modules. Also decreases binary size.

[profile.colcon]
inherits = "release"

[package.metadata.deb]
name = "marina"
section = "science"
priority = "optional"
assets = [
  [
    "target/release/marina",
    "usr/bin/marina",
    "755",
  ],
  [
    "completions/marina.bash",
    "usr/share/bash-completion/completions/marina",
    "644",
  ],
  [
    "completions/_marina",
    "usr/share/zsh/vendor-completions/_marina",
    "644",
  ],
  [
    "completions/marina.fish",
    "usr/share/fish/vendor_completions.d/marina.fish",
    "644",
  ],
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ version }/{ bin }{ binary-ext }"

[package.metadata.multivers.x86_64]
cpus = ["x86-64", "x86-64-v2", "x86-64-v3", "x86-64-v4", "raptorlake"]
