[package]
name = "marina"
version = "0.5.0"
edition = "2024"
include = ["**/*.rs", "**/*.md", "**/Cargo.toml", "**/LICENSE*", "default.rl"]
keywords = ["robotics"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/stelzo/marina"
authors = ["Christopher Sieh <stelzo@steado.de>"]
description = "A dataset manager for robotics to organize, share, and discover datasets and metadata across storage backends."
rust-version = "1.89.0"

[lib]
name = "marina"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "marina"
path = "src/main.rs"

[features]
default = ["osnabotics-default-registry", "db3", "gdrive"]
osnabotics-default-registry = ["mt_dataset/osnabotics-default-registry"]
db3 = ["mt_dataset/db3"]
gdrive = ["mt_dataset/gdrive"]
minot-registry = [
  "mt_dataset/minot-registry",
  "dep:mt_flow",
  "dep:mt_pubsub",
  "dep:mt_sea",
  "dep:mt_service",
]
cloudini-cpp = ["mt_dataset/cloudini-cpp"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
env_logger = "0.11"
futures = "0.3.34"
glob = "0.3"
humantime = "2.3"
log = "0.4.34"
mt_dataset = { version = "0.10.2", default-features = false }
mt_flow = { version = "0.10.2", default-features = false, optional = true }
mt_pubsub = { version = "0.10.2", default-features = false, optional = true }
mt_sea = { version = "0.10.2", default-features = false, optional = true }
mt_service = { version = "0.10.2", default-features = false, optional = true }
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "sync",
  "time",
] }
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
async-trait = "0.1"
flate2 = "1.1"
env_logger = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
tar = "0.4"

[lints.clippy]
collapsible_if = "allow"
manual_is_multiple_of = "allow"
redundant_pattern_matching = "allow"

[profile.release]
strip = "symbols" # Significantly reduce binary size
opt-level = "s"   # Optimize for size but keep some performance
debug = 0
panic = "abort"

[profile.full-release]
inherits = "release"
lto = "fat"          # Link Time Optimization
codegen-units = 1    # Slower compile times but compiler sees all generated code and can optimize over everything across modules. Also decreases binary size.

[profile.colcon]
inherits = "release"

[package.metadata.deb]
name = "marina"
section = "science"
priority = "optional"
assets = [
  [
    "target/release/marina",
    "usr/bin/marina",
    "755",
  ],
  [
    "completions/marina.bash",
    "usr/share/bash-completion/completions/marina",
    "644",
  ],
  [
    "completions/_marina",
    "usr/share/zsh/vendor-completions/_marina",
    "644",
  ],
  [
    "completions/marina.fish",
    "usr/share/fish/vendor_completions.d/marina.fish",
    "644",
  ],
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ version }/{ bin }{ binary-ext }"

[package.metadata.multivers.x86_64]
cpus = ["x86-64", "x86-64-v2", "x86-64-v3", "x86-64-v4", "raptorlake"]

