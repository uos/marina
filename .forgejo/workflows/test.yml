# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

name: Test

on:
  push:
  workflow_dispatch:

env:
  RUST_FONTCONFIG_DLOPEN: 1
  CARGO_BUILD_JOBS: 2

jobs:
  sanity-check:
    runs-on: ubuntu-dev-resolute
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          set -euo pipefail
          ulimit -n 65536
          VERSION=$(toml get --raw Cargo.toml package.version)
          echo "Workspace version: $VERSION"

          bash ./ensure-minot-source.bash
          cargo check --all-features --all-targets
          # mt_dataset is published by Minot before Marina. Keep ordinary CI
          # independent of crates.io index propagation during that bootstrap.
          cargo clippy --all-targets --no-deps -- -D warnings
