# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

name: Docs

on:
  push:
    paths:
      - docs/**
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-dev-resolute
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Install sudo
        run: apt-get update && apt-get install -y sudo
      - name: install nix
        uses: https://github.com/cachix/install-nix-action@v31
        with:
          install_options: --no-daemon
      - name: build pages
        run: |
          nix run .#buildDocs
      - name: Deploy to marina.steado.tech
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends rsync openssh-client
          key="$(mktemp)"
          hosts="$(mktemp)"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DOCS_DEPLOY_KEY" >"$key"
          echo "[marina.steado.tech]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvqpiJdvk+zuDXcjOgNdA3p98+6L7MAnhOEOLrw4phX" >"$hosts"
          # The key may only rsync into /var/www/marina.steado.tech (rrsync on the server).
          rsync -rlt --checksum --delete --delay-updates --chmod=D755,F644 --stats \
            -e "ssh -p 2222 -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$hosts -o StrictHostKeyChecking=yes" \
            docs/site/ marina-docs@marina.steado.tech:
